document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3b78d133-ffeb-490a-b0d6-1fdd9be3bb94\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{background:#4a4d54;font-family:'TH Sarabun New','Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}\n  input,select,button,textarea{font-family:inherit}\n  .cellinput{width:100%;border:none;background:transparent;color:inherit;font:inherit;outline:none;padding:2.5px 3px;border-radius:2px}\n  .cellinput:focus{background:#fff3cd}\n  .cellarea{display:block;width:100%;border:none;background:transparent;color:inherit;font:inherit;line-height:1.15;outline:none;padding:2.5px 4px;margin:0;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;field-sizing:content;min-height:1.2em;vertical-align:top}\n  .cellarea:focus{background:#fff3cd}\n  .billpage:hover .rowdel{opacity:.85}\n  @media print{\n    html,body{background:#fff !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}\n    [data-noprint]{display:none !important}\n    .pagesroot{display:block !important;padding:0 !important;gap:0 !important;align-items:stretch !important}\n    .pagewrap{width:auto !important;display:block !important}\n    .billpage{box-shadow:none !important;margin:0 !important;width:auto !important;min-height:0 !important;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}\n    table,th,td{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}\n    .cellinput:focus{background:transparent}\n  }\n  @page{size:A4;margin:5mm}\n<\u002Fstyle>\n<script src=\"3b3b7156-ac82-4101-914f-99df45f077e2\"><\u002Fscript>\n<script src=\"e00d2824-7fba-4662-ac66-d6bfb48a0027\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh\">\n  \n\n  <div data-noprint=\"\" style=\"position:sticky;top:0;z-index:30;background:#1f2227;color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.4)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 22px\">\n      <a href=\"STT-Invoice.html\" title=\"กลับหน้าแรก\" style=\"display:inline-flex;align-items:center;gap:6px;background:#2f333b;color:#fff;border:1px solid #444a55;font-size:13.5px;padding:8px 13px;border-radius:7px;cursor:pointer;text-decoration:none;flex:none\">← หน้าแรก<\u002Fa>\n      <div style=\"width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,#2a6fdb,#1f55ad);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 8px rgba(42,111,219,.45)\">\n        <svg sc-camel-view-box=\"0 0 100 56\" width=\"25\" style=\"transform:scaleX(-1)\"><rect x=\"3\" y=\"10\" width=\"56\" height=\"34\" rx=\"4\" fill=\"#fff\"><\u002Frect><rect x=\"59\" y=\"22\" width=\"27\" height=\"22\" rx=\"4\" fill=\"#fff\"><\u002Frect><circle cx=\"24\" cy=\"48\" r=\"7.5\" fill=\"#1f2227\"><\u002Fcircle><circle cx=\"70\" cy=\"48\" r=\"7.5\" fill=\"#1f2227\"><\u002Fcircle><\u002Fsvg>\n        <div style=\"color:#fff;font-weight:800;font-size:7.5px;line-height:1;letter-spacing:-.02em\">STT<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-weight:700;font-size:17px;letter-spacing:.2px\">STT Invoice <span style=\"font-weight:400;opacity:.5;font-size:14px\">· ใบวางบิล ฟอร์ม TATA<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:12.5px;opacity:.55\">สิงห์ทองทรัคทรานสปอร์ต &nbsp;×&nbsp; ทาทา สตีล<\u002Fdiv>\n      <div style=\"flex:1;min-width:8px\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onSaveWork }}\" style=\"background:#3b6fb0;color:#fff;border:none;font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:7px;cursor:pointer\">บันทึกไฟล์งาน<\u002Fbutton>\n      <label style=\"display:inline-flex;align-items:center;gap:7px;background:#2f333b;color:#fff;border:1px solid #444a55;font-size:13.5px;padding:8px 14px;border-radius:7px;cursor:pointer\">เปิดไฟล์งาน<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onOpenWork }}\" style=\"display:none\"><\u002Flabel>\n      <label style=\"display:inline-flex;align-items:center;gap:7px;background:#2a6fdb;color:#fff;font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:7px;cursor:pointer\">\n        นำเข้าไฟล์ Excel\n        <input type=\"file\" accept=\".xlsx,.csv,.xls,application/vnd.ms-excel\" multiple=\"multiple\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\">\n      <\u002Flabel>\n      <button sc-camel-on-click=\"{{ onAddSet }}\" style=\"background:#2f333b;color:#fff;border:1px solid #444a55;font-size:13.5px;padding:8px 14px;border-radius:7px;cursor:pointer\">+ ใบเปล่า<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onExportExcel }}\" style=\"background:#1d6f42;color:#fff;border:none;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:7px;cursor:pointer\">ส่งออก Excel<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onPrint }}\" style=\"background:#3a7d5d;color:#fff;border:none;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:7px;cursor:pointer\">พิมพ์ / บันทึก PDF<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onReset }}\" style=\"background:transparent;color:#aab0ba;border:1px solid #444a55;font-size:13px;padding:8px 12px;border-radius:7px;cursor:pointer\">รีเซ็ต<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:22px;flex-wrap:wrap;padding:0 22px 12px;font-size:13px;color:#cfd3da;align-items:center\">\n      <label style=\"display:inline-flex;align-items:center;gap:7px\">งวดรับชำระเงิน\n        <input value=\"{{ period }}\" sc-camel-on-input=\"{{ onPeriod }}\" placeholder=\"15 / 07 / 2569\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:5px 9px;font-size:13px;width:150px\"><\u002Flabel>\n      <label style=\"display:inline-flex;align-items:center;gap:7px\">วันที่วางบิล\n        <input value=\"{{ billDate }}\" sc-camel-on-input=\"{{ onBillDate }}\" placeholder=\"17 / 06 / 2569\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:5px 9px;font-size:13px;width:130px\"><\u002Flabel>\n      <label style=\"display:inline-flex;align-items:center;gap:7px\">ส่ง (ใบสรุป)\n        <input value=\"{{ recipient }}\" sc-camel-on-input=\"{{ onRecipient }}\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:5px 9px;font-size:13px;width:230px\"><\u002Flabel>\n      <label style=\"display:inline-flex;align-items:center;gap:6px\"><input type=\"checkbox\" checked=\"{{ showSummary }}\" sc-camel-on-change=\"{{ onToggleSummary }}\" style=\"width:15px;height:15px\">แสดงใบสรุป (ปะหน้า)<\u002Flabel>\n      <div style=\"opacity:.45;font-size:12px\">เคล็ดลับ: กด “นำเข้าไฟล์ Excel” เลือกไฟล์ข้อมูล (หลายไฟล์ = หลายใบแจ้งหนี้) ระบบจัดเป็นใบวางบิลให้อัตโนมัติ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;padding:10px 22px 12px;font-size:13px;color:#cfd3da;align-items:center;border-top:1px solid #2c3038\">\n      <span style=\"font-weight:600;color:#2a6fdb\">ลูกค้า<\u002Fspan>\n      <sc-raw-select value=\"{{ custName }}\" sc-camel-on-change=\"{{ onPickCustomer }}\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:6px 8px;font-size:13px;max-width:280px\">\n        <sc-for list=\"{{ customerNames }}\" as=\"cn\" hint-placeholder-count=\"1\"><option value=\"{{ cn }}\">{{ cn }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{ onNewCustomer }}\" style=\"background:#2f333b;color:#fff;border:1px solid #3c424c;border-radius:5px;padding:6px 11px;font-size:13px;cursor:pointer\">+ ลูกค้าใหม่<\u002Fbutton>\n      <input value=\"{{ custName }}\" sc-camel-on-input=\"{{ onCustName }}\" placeholder=\"ชื่อบริษัทลูกค้า\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:6px 9px;font-size:13px;width:300px\">\n      <input value=\"{{ custAddr }}\" sc-camel-on-input=\"{{ onCustAddr }}\" placeholder=\"ที่อยู่\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:6px 9px;font-size:13px;width:320px\">\n      <input value=\"{{ custTax }}\" sc-camel-on-input=\"{{ onCustTax }}\" placeholder=\"เลขผู้เสียภาษี\" style=\"background:#2a2e35;border:1px solid #3c424c;color:#fff;border-radius:5px;padding:6px 9px;font-size:13px;width:150px\">\n      <button sc-camel-on-click=\"{{ onSaveCustomer }}\" style=\"background:#2f333b;color:#fff;border:1px solid #4a8f68;border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer\">บันทึกลูกค้า<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onDeleteCustomer }}\" style=\"background:transparent;color:#aab0ba;border:1px solid #444a55;border-radius:5px;padding:6px 10px;font-size:13px;cursor:pointer\">ลบ<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pagesroot\" style=\"display:flex;flex-direction:column;align-items:center;gap:30px;padding:26px 14px 90px\">\n    {{ docsEl }}\n    <div data-noprint=\"\" style=\"color:#7d828b;font-size:12px;text-align:center;max-width:560px;line-height:1.6\">\n      แก้ตัวเลข/ข้อความในตารางได้โดยตรง — ยอดรวมและจำนวนเงินตัวอักษรคำนวณให้อัตโนมัติ • ข้อมูลถูกบันทึกในเครื่องอัตโนมัติ\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:720},&quot;zebra&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;ตัวเลือก&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.KEY = 'stt_tata_billing_v1';\n    this.CKEY = 'stt_tata_customers_v1';\n    const st = this.loadState();\n    st.customers = this.loadCustomers();\n    this.state = st;\n  }\n\n  uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }\n  parse(v){ if(v===null||v===undefined||v==='') return 0; const n=parseFloat(String(v).replace(/[^0-9.\\-]/g,'')); return isNaN(n)?0:n; }\n  fmt0(n){ return Number(n||0).toLocaleString('en-US'); }\n  fmt2(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  fmt3(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}); }\n  round2(n){ return Math.round((Number(n)||0)*100)/100; }\n\n  fmtDateShort(v){\n    if(v===''||v===null||v===undefined) return '';\n    const n=Number(v);\n    if(!isNaN(n)&&n>20000&&n<90000){ const d=new Date(Math.round((n-25569)*86400000)); const be=d.getUTCFullYear()+543; return d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+String(be%100).padStart(2,'0'); }\n    return String(v);\n  }\n\n  bahtText(num){\n    num = Math.round((Number(num)||0)*100)/100;\n    const baht = Math.floor(num);\n    const satang = Math.round((num-baht)*100);\n    const digit=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];\n    const pos=['','สิบ','ร้อย','พัน','หมื่น','แสน'];\n    const t=(n)=>{\n      n=Math.floor(n); if(n===0) return '';\n      if(n>999999){ const m=Math.floor(n/1000000), rest=n%1000000; return t(m)+'ล้าน'+(rest?t(rest):''); }\n      const s=String(n), len=s.length; let out='';\n      for(let i=0;i<len;i++){ const dd=+s[i], place=len-1-i; if(dd===0) continue;\n        if(place===0){ out += (dd===1 && len>1) ? 'เอ็ด' : digit[dd]; }\n        else if(place===1){ out += dd===1 ? 'สิบ' : (dd===2 ? 'ยี่สิบ' : digit[dd]+'สิบ'); }\n        else { out += digit[dd]+pos[place]; }\n      }\n      return out;\n    };\n    if(baht===0 && satang===0) return 'ศูนย์บาทถ้วน';\n    let res = baht>0 ? t(baht)+'บาท' : '';\n    res += satang>0 ? t(satang)+'สตางค์' : 'ถ้วน';\n    return res;\n  }\n\n  /* ---------- customers ---------- */\n  defaultCust(){ return { name:'บมจ.ทาทา สตีล การผลิต (ประเทศไทย)  (สาขา 00001)', addr:'351 หมู่ 6 ต.บ่อวิน อ.ศรีราชา จ.ชลบุรี 20230', tax:'0107536001273' }; }\n  loadCustomers(){ try{ const r=localStorage.getItem(this.CKEY); if(r){ const a=JSON.parse(r); if(Array.isArray(a)&&a.length) return a; } }catch(e){} return [ this.defaultCust() ]; }\n  persistCustomers(){ try{ localStorage.setItem(this.CKEY, JSON.stringify(this.state.customers)); }catch(e){} }\n  pickCustomer(name){ const c=(this.state.customers||[]).find(x=>x.name===name); if(c) this.upMeta({cust:{...c}}); }\n  saveCustomer(){\n    const c=this.state.meta.cust; if(!c||!c.name){ alert('กรุณากรอกชื่อลูกค้าก่อนบันทึก'); return; }\n    const list=(this.state.customers||[]).slice(); const idx=list.findIndex(x=>x.name===c.name);\n    if(idx>=0) list[idx]={...c}; else list.push({...c});\n    this.setState({customers:list}, ()=>this.persistCustomers());\n  }\n  deleteCustomer(){\n    const c=this.state.meta.cust; const list=(this.state.customers||[]).filter(x=>x.name!==c.name);\n    this.setState({customers:list.length?list:[this.defaultCust()]}, ()=>this.persistCustomers());\n  }\n\n  /* ---------- persistence ---------- */\n  persist(){ try{ localStorage.setItem(this.KEY, JSON.stringify({meta:this.state.meta, sets:this.state.sets})); }catch(e){} }\n  loadState(){\n    try{ const raw=localStorage.getItem(this.KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.sets){ const meta=o.meta||this.seedMeta(); if(!meta.cust) meta.cust=this.defaultCust(); if(meta.showSummary==null) meta.showSummary=true; return {meta, sets:o.sets}; } } }catch(e){}\n    return { meta:this.seedMeta(), sets:this.seedSets() };\n  }\n  seedMeta(){ return { period:'', billDate:'', recipient:'', showSummary:true, cust:this.defaultCust() }; }\n  seedSets(){ return [ this.mkSet([{}]) ]; }\n\n  mkRow(a){ a=a||{}; return {id:this.uid(), bol:a.bol||'', code:(a.code!=null?a.code:'สิงห์ทอง'), vtype:(a.vtype!=null?a.vtype:'18W_LARGE'), desc: lse inQ=false; } else field+=c; }\n      else { if(c==='\"') inQ=true; else if(c===','){ row.push(field); field=''; } else if(c==='\\n'){ row.push(field); rows.push(row); row=[]; field=''; } else if(c!=='\\r'){ field+=c; } }\n    }\n    if(field.length||row.length){ row.push(field); rows.push(row); }\n    return rows;\n  }\n  transform(grid){\n    if(!grid||!grid.length) return [];\n    const header=(grid[0]||[]).map(x=>String(x==null?'':x));\n    const find=(re)=>{ for(let i=0;i<header.length;i++){ if(re.test(header[i])) return i; } return -1; };\n    let iDate=find(/วันที่/), iBol=find(/ใบกำกับ|ใบแจ้งหนี้/), iCode=find(/รหัสสินค้า|รหัส/), iDesc=find(/รายละเอียด|รายการ|สถานที่/), iQty=find(/^\\s*จำนวน\\s*$/), iPrice=find(/ราคา/), iAmt=find(/รวมเป็นเงิน|จำนวนเงิน|รวมสุทธิ/);\n    if(iQty<0) iQty=find(/จำนวน(?!เงิน)/);\n    if(iDate<0)iDate=0; if(iBol<0)iBol=1; if(iCode<0)iCode=2; if(iDesc<0)iDesc=3; if(iQty<0)iQty=4; if(iPrice<0)iPrice=6; if(iAmt<0)iAmt=8;\n    const out=[];\n    for(let r=1;r<grid.length;r++){ const row=grid[r]; if(!row) continue;\n      const bol=String(row[iBol]==null?'':row[iBol]).trim();\n      const desc=String(row[iDesc]==null?'':row[iDesc]).trim();\n      if(!bol && !desc) continue;\n      out.push({ bol, code:'สิงห์ทอง', vtype:'18W_LARGE', desc, qty:this.parse(row[iQty]), amount:this.parse(row[iAmt]), price:this.parse(row[iPrice]), date:this.fmtDateShort(row[iDate]), note:'' });\n    }\n    return out;\n  }\n  async onImport(e){\n    const files=Array.from(e.target.files||[]); if(!files.length) return;\n    const newSets=[], xlsNames=[], failed=[];\n    for(const file of files){\n      const lower=String(file.name||'').toLowerCase();\n      if(lower.endsWith('.xls')){ xlsNames.push(file.name); continue; }\n      try{\n        let grid;\n        if(lower.endsWith('.csv')) grid = (typeof window.billParseCsv==='function') ? window.billParseCsv(await file.text()) : this.parseCsv(await file.text());\n        else grid = await window.parseXlsxGri
