<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>LionFlow — งานของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Sarabun',sans-serif;background:#eef0f3;color:#1d2b3a;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#eef0f3;}
  .head{background:radial-gradient(900px 400px at 30% -20%,#21405f,#16263a 62%,#101a28);color:#fff;padding:20px 20px 26px;}
  .card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px 16px;margin:14px;}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f2f4f7;font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:#98a2b3;flex:none;}
  .row .v{color:#1d2b3a;font-weight:600;text-align:right;}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:11px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .stepbtn{background:#2f6fb0;color:#fff;}
  .stepdone{background:#ecfdf3;color:#067647;border:1px solid #bfe6cf;}
  textarea{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;font-size:14px;font-family:inherit;color:#1d2b3a;resize:vertical;min-height:60px;box-sizing:border-box;}
  .muted{font-size:12px;color:#98a2b3;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16263a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s;z-index:50;box-shadow:0 8px 26px rgba(0,0,0,.3);}
  .toast.show{opacity:1;}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:middle;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* ตรวจสภาพก่อนออกงาน (v.2026-09-28f) */
  .ig{font-size:13.5px;font-weight:800;color:#16263a;margin:4px 0 8px;}
  .ii{padding:10px 0;border-bottom:1px solid #f2f4f7;}
  .ii:last-child{border-bottom:none;}
  .il{font-size:14px;color:#1d2b3a;font-weight:600;margin-bottom:8px;}
  .i3{display:flex;gap:6px;}
  .i3 button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;color:#667085;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;}
  .i3 button.on-ok{background:#ecfdf3;border-color:#1f8a5b;color:#067647;}
  .i3 button.on-warn{background:#fef7ec;border-color:#d99a2b;color:#b7791f;}
  .i3 button.on-fail{background:#fef3f2;border-color:#d92d20;color:#b42318;}
  .inp{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px;font-family:inherit;color:#1d2b3a;}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .thumbs div{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;background:#f2f4f7;}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumbs span{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;text-align:center;cursor:pointer;}
  .pick{display:inline-block;padding:9px 14px;border:1px dashed #98a2b3;border-radius:10px;font-size:13px;font-weight:700;color:#475467;cursor:pointer;background:#f9fafb;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <div style="font-size:12.5px;color:#E8A33D;font-weight:700;letter-spacing:.08em;">LIONFLOW · งานของฉัน</div>
    <div id="hTitle" style="font-size:20px;font-weight:800;margin-top:6px;">กำลังโหลด… <span class="spin"></span></div>
    <div id="hSub" style="font-size:13px;color:#aab8c8;margin-top:4px;"></div>
  </div>
  <div id="body"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== config : ENV AUTO-SWITCH =====
// default = PRODUCTION. staging เมื่อ hostname มี staging/localhost หรือใส่ ?env=staging
// ⚠️ สลับทั้ง URL + KEY ไป Supabase project คนละตัว — staging ไม่แตะ prod DB
var LF_ENVS={
  prod:    {url:'https://ojttzvcqjqqqullopeqt.supabase.co', key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdHR6dmNxanFxcXVsbG9wZXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzE1MDAsImV4cCI6MjA5Nzk0NzUwMH0.68VmEegEuj6IrG3XweK4AQEufhzvQiUz79ThL28LOzk'},
  staging: {url:'https://vugqoevhxqssdqykwgpi.supabase.co', key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1Z3FvZXZoeHFzc2RxeWt3Z3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzE2MzYsImV4cCI6MjA5ODkwNzYzNn0.G_wDLk8lnbp4zWH83x28MFnbS5hYiExHB33ZNQSCkhg'}
};
var LF_ENV=(function(){try{var p=new URLSearchParams(location.search).get('env');if(p==='staging'||p==='prod')return p;if(/staging|localhost|127\.0\.0\.1/.test((location.hostname||'')+(location.pathname||'')))return 'staging';}catch(e){}return 'prod';})();
var SUPABASE_URL=LF_ENVS[LF_ENV].url;
var SUPABASE_KEY=LF_ENVS[LF_ENV].key;
try{console.log('[LionFlow driver] env =',LF_ENV,'→',SUPABASE_URL);}catch(e){}
var H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};

var TOKEN=new URLSearchParams(location.search).get('t')||'';
var JOB=null, JOBID=null, DRIVER=null;

var THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso){if(!iso)return '—';var p=String(iso).slice(0,10).split('-');if(p.length!==3)return iso;return (+p[2])+' '+THM[(+p[1])-1]+' '+((+p[0])+543);}
function nowLocal(){var d=new Date();var p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function fmtT(iso){if(!iso)return '';var m=String(iso).match(/T(\d{2}:\d{2})/);return m?(' · '+m[1]+' น.'):'';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show');},2200);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function rpc(fn,args){return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,status:r.status,data:d};});});}

function getGeo(){return new Promise(function(res){if(!navigator.geolocation){res({});return;}navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude});},function(){res({});},{enableHighAccuracy:true,timeout:6000,maximumAge:30000});});}

// ===== แชร์ตำแหน่งระหว่างวิ่งงาน =====
// เปิดอัตโนมัติหลังกด “รับงาน/ออกเดินทาง” หยุดเองเมื่อ “ส่งของเสร็จ”
// ส่งพิกัดขึ้นคลาวด์ทุก 60 วินาที ผ่าน RPC ที่ผูกกับ token ใบงานนี้เท่านั้น
// v.2026-08-28c: ลดโหลดเขียน DB — ส่งพิกัดทุก 3 นาที (เดิม 1 นาที) และข้ามถ้ารถไม่ขยับเกิน 50 ม.
// เคส 28/08/2026: รถวิ่งพร้อมกันหลายคัน × ส่งทุก 1 นาที ตลอดวัน (รถจอดรอโหลดของก็ยังส่ง) → DB รับไม่ทัน
var SHARE_MS=180000, SHARE_MIN_M=50, SHARE_MAX_MS=900000;   // ขยับ<50ม. ไม่ส่ง แต่บังคับส่ง 1 ครั้ง/15 นาที เพื่อยืนยันว่ายังออนไลน์
var shareWatch=null, shareTimer=null, lastFix=null, lastSent=0, sentFix=null, sendCount=0, shareErr='', shareSupported=true;
function moveMeters(a,b){   // haversine อย่างย่อ
  if(!a||!b)return 1e9;
  var R=6371000,t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function shareKey(){return 'lf_share_'+String(JOBID||TOKEN).slice(0,24);}
function shareOn(){try{var v=localStorage.getItem(shareKey());if(v!==null)return v==='1';}catch(e){}return true;}
function setShare(on){try{localStorage.setItem(shareKey(),on?'1':'0');}catch(e){}if(on)startShare();else stopShare();renderShare();}
function shareEligible(){return !!(shareSupported&&JOB&&JOB.pickupTime&&!JOB.completionTime);}
function startShare(){
  if(!shareEligible()||!shareOn()||!navigator.geolocation)return;
  if(shareWatch===null){
    shareWatch=navigator.geolocation.watchPosition(function(p){
      shareErr='';
      lastFix={lat:p.coords.latitude,lng:p.coords.longitude,
        speed:(p.coords.speed!=null&&p.coords.speed>=0)?Math.round(p.coords.speed*3.6):null,
        acc:p.coords.accuracy!=null?Math.round(p.coords.accuracy):null,
        heading:(p.coords.heading!=null&&!isNaN(p.coords.heading))?Math.round(p.coords.heading):null};
      if(Date.now()-lastSent>SHARE_MS-1500)pushFix();
    },function(err){shareErr=(err&&err.code===1)?'ไม่ได้อนุญาตให้เข้าถึงตำแหน่ง':'หาตำแหน่งไม่ได้ (สัญญาณอ่อน)';renderShare();},
    {enableHighAccuracy:true,timeout:20000,maximumAge:15000});
  }
  if(!shareTimer)shareTimer=setInterval(pushFix,SHARE_MS);
}
function stopShare(){if(shareWatch!==null){try{navigator.geolocation.clearWatch(shareWatch);}catch(e){}shareWatch=null;}if(shareTimer){clearInterval(shareTimer);shareTimer=null;}}
function pushFix(){
  if(!lastFix||!shareEligible()||!shareOn())return;
  // รถจอดอยู่ (ขยับ<50ม.) → ไม่ต้องส่งซ้ำ ยกเว้นเกิน 15 นาทีแล้วยังไม่ส่งเลย
  if(sentFix&&moveMeters(sentFix,lastFix)<SHARE_MIN_M&&Date.now()-lastSent<SHARE_MAX_MS){renderShare();return;}
  lastSent=Date.now();
  var _f=lastFix;
  rpc('driver_push_position',{_token:TOKEN,_lat:lastFix.lat,_lng:lastFix.lng,_speed:lastFix.speed||0,_acc:lastFix.acc,_heading:lastFix.heading})
    .then(function(r){
      // ระบบหลังบ้านยังไม่ได้เปิดฟีเจอร์นี้ — ซ่อนการ์ดไปเงียบๆ อย่าขึ้นแดงกวน พขร.
      if(r.status===404||(r.data&&/function|does not exist|schema cache/i.test(String(r.data.message||'')))){shareSupported=false;stopShare();renderShare();return;}
      if(r.ok){sendCount++;shareErr='';sentFix=_f;}else{shareErr='ส่งพิกัดไม่สำเร็จ';}renderShare();})
    .catch(function(){shareErr='ออฟไลน์ — จะส่งใหม่อัตโนมัติ';renderShare();});
}
function renderShare(){
  var el=document.getElementById('shareBox'); if(!el)return;
  if(!shareSupported){el.style.display='none';return;}
  el.style.display='';
  var on=shareOn(), live=on&&shareEligible();
  var when=lastSent?new Date(lastSent):null;
  var p=function(n){return String(n).padStart(2,'0');};
  var status = !JOB.pickupTime||JOB.completionTime ? 'จะเริ่มส่งอัตโนมัติเมื่อกด “รับงาน / ออกเดินทาง”'
    : !on ? 'ปิดอยู่ — ออฟฟิศจะไม่เห็นตำแหน่งรถ'
    : shareErr ? shareErr
    : when ? ('ส่งแล้ว '+sendCount+' ครั้ง · ล่าสุด '+p(when.getHours())+':'+p(when.getMinutes())+' น.')
    : 'กำลังหาตำแหน่ง…';
  var color = (!on||shareErr)?'#b42318':(live&&when?'#067647':'#98a2b3');
  el.innerHTML='<div style="display:flex;align-items:center;gap:12px;">'
    +'<div style="flex:1;min-width:0;">'
      +'<div style="font-size:13.5px;font-weight:800;color:#16263a;display:flex;align-items:center;gap:7px;">'
        +(live&&when?'<span style="width:9px;height:9px;border-radius:50%;background:#1f8a5b;display:inline-block;box-shadow:0 0 0 3px rgba(31,138,91,.18);"></span>':'')
        +'แชร์ตำแหน่งให้ออฟฟิศ</div>'
      +'<div style="font-size:12px;color:'+color+';margin-top:4px;line-height:1.5;">'+esc(status)+'</div>'
    +'</div>'
    +'<button onclick="setShare('+(on?'false':'true')+')" style="flex:none;width:56px;height:31px;border-radius:16px;border:none;cursor:pointer;padding:0;background:'+(on?'#1f8a5b':'#cdd5df')+';position:relative;transition:background .2s;">'
      +'<span style="position:absolute;top:3px;left:'+(on?'28px':'3px')+';width:25px;height:25px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);"></span></button>'
  +'</div>'
  +'<div style="font-size:11.5px;color:#98a2b3;margin-top:9px;line-height:1.6;">ส่งพิกัดทุก 3 นาที เพิ่งตอนรถขยับ เกิน 50 ม. · เก็บเฉพาะช่วงที่งานนี้ยังไม่ปิด · หยุดเองเมื่อกด “ส่งของเสร็จ” · เปิดหน้านี้ค้างไว้ระหว่างวิ่ง</div>';
}

function load(){
  if(!TOKEN){fail('ลิงก์ไม่ถูกต้อง (ไม่มี token)');return;}
  rpc('driver_get_job',{_token:TOKEN}).then(function(r){
    if(!r.ok){var m=(r.data&&r.data.message)||'';
      fail(/job not found/i.test(m)?'ไม่พบใบงานนี้ในระบบ (ใบงานอาจยังไม่ถูกบันทึกขึ้นคลาวด์ หรือถูกลบ)':(/invalid or expired/i.test(m)?'ลิงก์หมดอายุหรือถูกยกเลิก':(r.status===404?'ไม่พบงาน':('เปิดงานไม่ได้ · '+(m||r.status)))));return;}
    JOB=r.data.job||{}; JOBID=r.data.jobId; DRIVER=r.data.driver||null;
    // v.2026-08-28d: รถคันนี้มีกล่อง GPS ติดรถอยู่แล้ว → ไม่ต้องส่งซ้ำจากมือถือ (ซ่อนการ์ดไปเงียบ)
    if(r.data.gps===false){shareSupported=false;stopShare();}
    render(); insLoad();
  }).catch(function(){fail('เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต');});
}
function fail(msg){
  document.getElementById('hTitle').textContent='เปิดงานไม่ได้';
  document.getElementById('hSub').textContent='';
  document.getElementById('body').innerHTML='<div class="card" style="text-align:center;padding:30px 18px;"><div style="font-size:40px;margin-bottom:10px;">🔒</div><div style="font-size:15px;font-weight:700;color:#b42318;">'+esc(msg)+'</div><div class="muted" style="margin-top:8px;line-height:1.6;">ลิงก์งานนี้ใช้ได้เฉพาะงานเดียวและมีวันหมดอายุ<br/>ติดต่อหัวหน้างานเพื่อขอลิงก์ใหม่</div></div>';
}

function step(field,label,extra){
  var already=JOB[field];
  if(already){toast('บันทึกไว้แล้ว'); return;}
  var btn=document.getElementById('b_'+field);
  if(btn){btn.disabled=true;btn.innerHTML='กำลังบันทึก… <span class="spin"></span>';}
  getGeo().then(function(g){
    var patch={}; patch[field]=nowLocal();
    if(extra&&g.lat){patch[extra.lat]=g.lat;patch[extra.lng]=g.lng;}
    rpc('driver_update_progress',{_token:TOKEN,_patch:patch}).then(function(r){
      if(!r.ok){toast('บันทึกไม่สำเร็จ');if(btn){btn.disabled=false;btn.textContent=label;}return;}
      Object.assign(JOB,patch); toast('✓ '+label+' แล้ว'); render();
      if(field==='pickupTime')startShare();
      if(field==='completionTime')stopShare();
    }).catch(function(){toast('เชื่อมต่อไม่ได้');if(btn){btn.disabled=false;btn.textContent=label;}});
  });
}
function saveNote(){
  var v=document.getElementById('note').value;
  rpc('driver_update_progress',{_token:TOKEN,_patch:{driverNote:v}}).then(function(r){toast(r.ok?'บันทึกหมายเหตุแล้ว':'บันทึกไม่สำเร็จ');if(r.ok)JOB.driverNote=v;});
}

// ===== ตรวจสภาพก่อนออกงาน โดย พขร. เอง (v.2026-09-28f) =====
// ใช้เมื่อรถไม่ได้อยู่ใกล้คนจ่ายงาน · ส่งผ่าน RPC driver_submit_inspection (ผูก token ใบงานนี้)
// ⚠️ รายการต้องตรงกับ INSPECT_VEH / INSPECT_DRIVER / INSPECT_CUST ใน app.dc.html (คีย์ v<g>_<i> / d<i> / c<i>)
var INSPECT_VEH=[
  {g:'ยางและล้อ',icon:'🛞',items:['ลมยางทุกล้อ','ดอกยาง / รอยสึก','น็อตล้อครบ-แน่น','ยางอะไหล่']},
  {g:'ระบบเบรก',icon:'🛑',items:['ลมเบรก (แรงดัน)','ผ้าเบรก','เบรกมือ']},
  {g:'ไฟและสัญญาณ',icon:'💡',items:['ไฟหน้า / ไฟสูง','ไฟเลี้ยว-ไฟเบรก','แตร','ไฟฉุกเฉิน']},
  {g:'ของเหลว / เครื่องยนต์',icon:'🛢️',items:['น้ำมันเครื่อง','น้ำหล่อเย็น','เชื้อเพลิง']},
  {g:'อุปกรณ์นิรภัย',icon:'🧯',items:['ถังดับเพลิง','สามเหลี่ยมสะท้อนแสง','เข็มขัดนิรภัย']}
];
var INSPECT_DRIVER=['วัดแอลกอฮอล์ = 0.00','พักผ่อน ≥ 8 ชม. ก่อนขับ','ชั่วโมงขับสะสม < 8 ชม./วัน','ใบขับขี่ ท.2 ไม่หมดอายุ','สุขภาพพร้อม / ไม่มีอาการป่วย'];
var INSPECT_CUST=['สวม PPE ครบ (หมวก/รองเท้าเซฟตี้)','เสื้อสะท้อนแสง','ผ้าใบคลุมสินค้า / สายรัด'];
var INS_SECS=[{k:'veh',l:'รูปสภาพรถ'},{k:'driver',l:'รูปคนขับ / เอกสาร'},{k:'cust',l:'รูปอุปกรณ์ / ระเบียบลูกค้า'}];
var INS={ready:false, supported:true, company:'', last:null, open:false, d:null, uploading:0, saving:false};
function insBlank(){var st={};INSPECT_VEH.forEach(function(s,gi){s.items.forEach(function(_,ii){st['v'+gi+'_'+ii]='ok';});});INSPECT_DRIVER.forEach(function(_,i){st['d'+i]='ok';});INSPECT_CUST.forEach(function(_,i){st['c'+i]='ok';});return st;}
function insLoad(){
  rpc('driver_get_inspection',{_token:TOKEN}).then(function(r){
    if(r.status===404||(r.data&&/function|does not exist|schema cache/i.test(String(r.data.message||'')))){INS.supported=false;renderIns();return;}
    if(r.ok&&r.data){INS.company=r.data.company||'';INS.last=r.data.last||null;INS.ready=true;}
    renderIns();
  }).catch(function(){renderIns();});
}
var RES={pass:['✓ ผ่าน','#067647','#ecfdf3','#bfe6cf'],review:['⚠ ผ่าน (มีเฝ้าระวัง)','#b7791f','#fef7ec','#f3dcae'],fail:['⛔ ไม่ผ่าน','#b42318','#fef3f2','#f3c9c3']};
function renderIns(){
  var el=document.getElementById('insBox'); if(!el)return;
  if(!INS.supported||!INS.ready){el.style.display='none';return;}
  el.style.display='';
  var L=INS.last, h='<div style="font-size:13.5px;font-weight:800;color:#16263a;">🛡️ ตรวจสภาพก่อนออกงาน</div>';
  if(L&&L.result){
    var c=RES[L.result]||RES.pass;
    h+='<div style="margin-top:10px;padding:11px 12px;border-radius:10px;background:'+c[2]+';border:1px solid '+c[3]+';">'
      +'<div style="font-size:14.5px;font-weight:800;color:'+c[1]+';">'+esc(c[0])+(L.score!=null?(' · '+esc(L.score)+'%'):'')+'</div>'
      +'<div style="font-size:12px;color:#475467;margin-top:3px;">ตรวจเมื่อ '+esc(thDate(L.date))+' '+esc(L.time||'')+' น. · '
      +(L.approvedBy?('อนุมัติแล้วโดย '+esc(L.approvedBy)):'รอหัวหน้างานอนุมัติ')+'</div>'
      +(L.result==='fail'?'<div style="font-size:12.5px;color:#b42318;font-weight:700;margin-top:5px;">แจ้งหัวหน้างานก่อนออกรถ</div>':'')
      +'</div>'
      +'<button class="btn" style="margin:12px 0 0;background:#fff;border:1px solid #d0d5dd;color:#344054;" onclick="insOpen()">ตรวจใหม่</button>';
  }else{
    h+='<div class="muted" style="margin-top:5px;line-height:1.6;">ยังไม่มีใบตรวจของงานนี้ · ตรวจรถก่อนออกเดินทาง ใช้เวลาไม่ถึง 2 นาที</div>'
      +'<button class="btn" style="margin:12px 0 0;background:#16263a;color:#fff;" onclick="insOpen()">เริ่มตรวจสภาพรถ</button>';
  }
  el.innerHTML=h;
}
function insOpen(){INS.open=true;INS.d={fid:'d'+Date.now()+Math.random().toString(36).slice(2,6),st:insBlank(),photos:{veh:[],driver:[],cust:[]},alcohol:'0.00',note:''};render();window.scrollTo(0,0);}
function insClose(){if(INS.uploading){toast('รอให้อัปโหลดรูปเสร็จก่อน');return;}INS.open=false;INS.d=null;render();window.scrollTo(0,0);}
function insItem(k,label){
  var v=INS.d.st[k];
  return '<div class="ii"><div class="il">'+esc(label)+'</div><div class="i3" id="i3_'+k+'">'
    +'<button class="'+(v==='ok'?'on-ok':'')+'" onclick="insSet(\''+k+'\',\'ok\')">✓ ปกติ</button>'
    +'<button class="'+(v==='warn'?'on-warn':'')+'" onclick="insSet(\''+k+'\',\'warn\')">⚠ เฝ้าระวัง</button>'
    +'<button class="'+(v==='fail'?'on-fail':'')+'" onclick="insSet(\''+k+'\',\'fail\')">✕ ไม่ผ่าน</button>'
    +'</div></div>';
}
function insSet(k,v){
  INS.d.st[k]=v;
  var b=document.getElementById('i3_'+k); if(b){var bs=b.getElementsByTagName('button');bs[0].className=v==='ok'?'on-ok':'';bs[1].className=v==='warn'?'on-warn':'';bs[2].className=v==='fail'?'on-fail':'';}
  insSummary();
}
function insResult(){var v=Object.keys(INS.d.st).map(function(k){return INS.d.st[k];});if(v.indexOf('fail')>=0)return 'fail';if(v.indexOf('warn')>=0)return 'review';return 'pass';}
function insSummary(){
  var el=document.getElementById('insSum'); if(!el)return;
  var r=insResult(), c=RES[r];
  var nf=0,nw=0;Object.keys(INS.d.st).forEach(function(k){if(INS.d.st[k]==='fail')nf++;else if(INS.d.st[k]==='warn')nw++;});
  el.style.background=c[2];el.style.borderColor=c[3];el.style.color=c[1];
  el.innerHTML='<b>'+esc(c[0])+'</b>'+(nf||nw?(' · ไม่ผ่าน '+nf+' · เฝ้าระวัง '+nw):' · ทุกข้อปกติ');
}
function insThumbs(k){
  return (INS.d.photos[k]||[]).map(function(u,i){return '<div><img src="'+esc(u)+'"/><span onclick="insDelPhoto(\''+k+'\','+i+')">✕</span></div>';}).join('');
}
function insRenderPhotos(k){var el=document.getElementById('th_'+k);if(el)el.innerHTML=insThumbs(k);var u=document.getElementById('insUp');if(u)u.textContent=INS.uploading?('กำลังอัปโหลดรูป '+INS.uploading+' รูป…'):'';}
function insDelPhoto(k,i){INS.d.photos[k].splice(i,1);insRenderPhotos(k);}
function compressToBlob(file,max,q){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){try{var sc=Math.min(1,max/Math.max(img.width||1,img.height||1));var w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);c.toBlob(function(b){b?res(b):rej(new Error('แปลงรูปไม่สำเร็จ'));},'image/jpeg',q);}catch(e){rej(e);}};img.onerror=function(){rej(new Error('เปิดรูปนี้ไม่ได้ (ลองถ่ายใหม่)'));};img.src=r.result;};r.onerror=function(){rej(new Error('อ่านไฟล์ไม่ได้'));};r.readAsDataURL(file);});}
function insAddPhoto(k,inp){
  var f=inp.files&&inp.files[0]; try{inp.value='';}catch(e){} if(!f||!INS.d)return;
  if((INS.d.photos[k]||[]).length>=6){toast('หมวดนี้ใส่ได้สูงสุด 6 รูป');return;}
  var d=INS.d; INS.uploading++; insRenderPhotos(k);
  var path=INS.company+'/inspections/'+d.fid+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
  compressToBlob(f,1000,0.6).then(function(b){
    return fetch(SUPABASE_URL+'/storage/v1/object/attachments/'+encodeURI(path),{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:b});
  }).then(function(res){
    if(!res.ok)throw new Error('อัปโหลดไม่สำเร็จ ('+res.status+')');
    if(INS.d===d)d.photos[k].push(SUPABASE_URL+'/storage/v1/object/public/attachments/'+encodeURI(path));
  }).catch(function(e){toast((e&&e.message)||'อัปโหลดรูปไม่สำเร็จ');})
  .then(function(){INS.uploading=Math.max(0,INS.uploading-1);insRenderPhotos(k);});
}
function insSubmit(){
  if(INS.saving)return;
  if(INS.uploading){toast('รอให้อัปโหลดรูปเสร็จก่อน');return;}
  var d=INS.d, r=insResult();
  if(r==='fail'&&!window.confirm('มีรายการ "ไม่ผ่าน" — ส่งใบตรวจและแจ้งหัวหน้างาน?'))return;
  INS.saving=true;
  var btn=document.getElementById('insGo'); if(btn){btn.disabled=true;btn.innerHTML='กำลังส่ง… <span class="spin"></span>';}
  var alc=document.getElementById('insAlc'), nt=document.getElementById('insNote');
  var photos={};INS_SECS.forEach(function(s){if(d.photos[s.k].length)photos[s.k]=d.photos[s.k];});
  rpc('driver_submit_inspection',{_token:TOKEN,_data:{status:d.st,photos:photos,alcohol:alc?alc.value:'0.00',note:nt?nt.value:''}}).then(function(res){
    INS.saving=false;
    if(!res.ok){var m=String((res.data&&res.data.message)||res.status);
      toast(/no truck/.test(m)?'ใบงานนี้ยังไม่ระบุทะเบียนรถ — แจ้งออฟฟิศ':(/too many/.test(m)?'วันนี้ส่งใบตรวจของงานนี้ครบ 10 ครั้งแล้ว':(/expired/.test(m)?'ลิงก์หมดอายุ':'ส่งไม่สำเร็จ · '+m)));
      if(btn){btn.disabled=false;btn.textContent='ส่งผลตรวจ';}return;}
    var p=function(n){return String(n).padStart(2,'0');},t=new Date();
    INS.last={result:res.data.result,score:res.data.score,approvedBy:'',date:t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()),time:p(t.getHours())+':'+p(t.getMinutes())};
    INS.open=false;INS.d=null;render();window.scrollTo(0,0);
    toast(res.data.result==='fail'?'ส่งแล้ว — แจ้งหัวหน้างานก่อนออกรถ':'✓ ส่งผลตรวจแล้ว');
  }).catch(function(){INS.saving=false;toast('เชื่อมต่อไม่ได้ — ลองใหม่');if(btn){btn.disabled=false;btn.textContent='ส่งผลตรวจ';}});
}
function renderInsForm(){
  var j=JOB, d=INS.d, h='';
  document.getElementById('hTitle').textContent='ตรวจสภาพก่อนออกงาน';
  document.getElementById('hSub').textContent=(j.truckPlate||'—')+' · ใบงาน '+(j.jobNo||'—');
  h+='<div class="card" style="padding:12px 16px;"><button onclick="insClose()" style="border:none;background:none;font-family:inherit;font-size:14px;font-weight:700;color:#2f6fb0;padding:0;cursor:pointer;">‹ กลับหน้างาน</button>'
    +'<div class="muted" style="margin-top:6px;line-height:1.6;">ทุกข้อตั้งเป็น "ปกติ" ไว้ให้แล้ว — กดเปลี่ยนเฉพาะข้อที่มีปัญหา</div></div>';
  INSPECT_VEH.forEach(function(s,gi){
    h+='<div class="card"><div class="ig">'+s.icon+' '+esc(s.g)+'</div>';
    s.items.forEach(function(it,ii){h+=insItem('v'+gi+'_'+ii,it);});
    h+='</div>';
  });
  h+='<div class="card"><div class="ig">🧑‍✈️ ความพร้อมคนขับ</div>';
  INSPECT_DRIVER.forEach(function(it,i){h+=insItem('d'+i,it);});
  h+='<div style="margin-top:10px;"><div class="il">ผลวัดแอลกอฮอล์ (mg%)</div><input id="insAlc" class="inp" inputmode="decimal" maxlength="10" value="'+esc(d.alcohol)+'" oninput="INS.d.alcohol=this.value"/></div></div>';
  h+='<div class="card"><div class="ig">🦺 ระเบียบลูกค้า</div>';
  INSPECT_CUST.forEach(function(it,i){h+=insItem('c'+i,it);});
  h+='</div>';
  h+='<div class="card"><div class="ig">📷 รูปถ่าย (ไม่บังคับ)</div>';
  INS_SECS.forEach(function(s){
    h+='<div style="padding:8px 0;"><div class="il" style="margin-bottom:6px;">'+esc(s.l)+'</div>'
      +'<label class="pick">＋ ถ่าย / เลือกรูป<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="insAddPhoto(\''+s.k+'\',this)"/></label>'
      +'<div class="thumbs" id="th_'+s.k+'">'+insThumbs(s.k)+'</div></div>';
  });
  h+='<div id="insUp" class="muted" style="color:#2f6fb0;"></div></div>';
  h+='<div class="card"><div class="ig">📝 หมายเหตุ</div><textarea id="insNote" maxlength="1000" placeholder="เช่น ยางหลังซ้ายลมอ่อน เติมแล้ว" oninput="INS.d.note=this.value">'+esc(d.note)+'</textarea></div>';
  h+='<div class="card"><div id="insSum" style="padding:11px 12px;border-radius:10px;border:1px solid;font-size:14px;margin-bottom:12px;"></div>'
    +'<button class="btn stepbtn" id="insGo" style="margin:0;" onclick="insSubmit()">ส่งผลตรวจ</button>'
    +'<div class="muted" style="text-align:center;margin-top:8px;">ผลตรวจจะส่งให้หัวหน้างานอนุมัติ</div></div>';
  document.getElementById('body').innerHTML=h+'<div style="height:20px;"></div>';
  insSummary(); insRenderPhotos('veh');
}

function render(){
  if(INS.open&&INS.d){renderInsForm();return;}
  var j=JOB;
  document.getElementById('hTitle').textContent='ใบงาน '+(j.jobNo||'—');
  document.getElementById('hSub').textContent=(j.deliveryNo?('บิล '+j.deliveryNo+' · '):'')+thDate(j.date);
  var info='<div class="card">'
    +row('พนักงานขับรถ',(DRIVER&&DRIVER.name)||j.driverName||'—')
    +row('ทะเบียนรถ',j.truckPlate||'—')
    +row('ต้นทาง',j.origin||'—')
    +row('ปลายทาง',j.destination||'—')
    +row('ลูกค้า',j.customer||'—')
    +(j.fuelAdvance?row('เบิกน้ำมันล่วงหน้า',j.fuelAdvance+(j.fuelAdvanceNote?(' · '+j.fuelAdvanceNote):'')):'')
    +'</div>';
  var steps='<div class="card"><div style="font-size:13px;font-weight:800;color:#16263a;margin-bottom:12px;">อัปเดตสถานะงาน</div>'
    +sbtn('pickupTime','① รับงาน / ออกเดินทาง',{lat:'pickupLat',lng:'pickupLng'})
    +sbtn('arrivalTime','② ถึงจุดส่ง',{lat:'arrivalLat',lng:'arrivalLng'})
    +sbtn('completionTime','③ ส่งของเสร็จ',{lat:'completionLat',lng:'completionLng'})
    +sbtn('documentTime','④ ส่งเอกสารคืน',null)
    +'</div>';
  var share='<div class="card" id="shareBox"></div>';
  var note='<div class="card"><div style="font-size:13px;font-weight:800;color:#16263a;margin-bottom:8px;">หมายเหตุถึงออฟฟิศ</div>'
    +'<textarea id="note" placeholder="พิมพ์หมายเหตุ (ถ้ามี)…">'+esc(j.driverNote||'')+'</textarea>'
    +'<button class="btn stepbtn" style="margin-top:10px;background:#475467;" onclick="saveNote()">บันทึกหมายเหตุ</button></div>';
  var ins=j.completionTime?'':'<div class="card" id="insBox" style="display:none;"></div>';   // ส่งของเสร็จแล้ว ไม่ต้องตรวจ
  document.getElementById('body').innerHTML=info+ins+steps+share+note+'<div class="muted" style="text-align:center;padding:6px 0 24px;">🔒 ลิงก์นี้เข้าถึงได้เฉพาะงานนี้งานเดียว</div>';
  renderShare(); startShare(); renderIns();
}
function row(k,v){return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';}
function sbtn(field,label,extra){
  var done=JOB[field];
  if(done)return '<button class="btn stepdone" disabled>✓ '+esc(label.replace(/^[①②③④]\s*/,''))+esc(fmtT(done))+'</button>';
  return '<button class="btn stepbtn" id="b_'+field+'" onclick="step(\''+field+'\',\''+esc(label)+'\','+(extra?'{lat:\''+extra.lat+'\',lng:\''+extra.lng+'\'}':'null')+')">'+esc(label)+'</button>';
}
load();
</script>
</body>
</html>
